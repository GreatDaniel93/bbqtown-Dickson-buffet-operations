<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172018"><title>BBQ Town Prep List</title><style>:root{--ink:#172018;--muted:#6b756e;--line:#dfe5df;--bg:#f5f4ef;--green:#2e7d49;--amber:#b87400;--red:#be3030}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}header{background:#172018;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}.bar{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.bar h1{margin:0;font-size:21px}.bar small{color:#b8c6bc}.back{color:#fff;text-decoration:none;border:1px solid #ffffff44;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:800}main{max-width:980px;margin:auto;padding:16px}.hero h2{margin:0;font-size:28px}.hero p{margin:5px 0 14px;color:var(--muted)}.toolbar,.add{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar input,.toolbar select,.add input,.add select,.add textarea{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff}.toolbar input{min-width:145px}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:900;background:#172018;color:#fff}.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.warn{background:#fff3dd;color:#754a00;border:1px solid #e7c878}.addgrid{display:grid;grid-template-columns:1.5fr .7fr .7fr auto;gap:8px}.task{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:8px}.task.done{opacity:.55}.check{width:46px;height:46px;border-radius:11px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:900}.task.done .check{background:#e8f5ec;color:var(--green);border-color:#b8dbc2}.task h3{margin:0;font-size:15px}.task p{margin:4px 0 0;color:var(--muted);font-size:11px}.tag{font-size:10px;font-weight:900;border-radius:99px;padding:5px 7px;background:#eef1ed;color:var(--muted)}.section{margin:15px 0 7px;font-size:11px;font-weight:900;color:var(--muted);letter-spacing:.05em}.progress{margin:10px 0 14px}.track{height:9px;background:#e1e7e1;border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--green);width:0}.summary{font-size:12px;font-weight:800;margin-bottom:6px}.empty{padding:25px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#172018;color:#fff;padding:12px 16px;border-radius:10px;display:none;font-weight:800}@media(max-width:650px){.addgrid{grid-template-columns:1fr 1fr}.addgrid .wide{grid-column:1/-1}.task{grid-template-columns:48px 1fr}.tag{grid-column:2;justify-self:start}.hero h2{font-size:24px}}</style></head><body><header><div class="bar"><div><h1>BBQ TOWN</h1><small>Dickson · Kitchen Prep</small></div><a class="back" href="/ops.html?full=1">KITCHEN</a></div></header><main><div class="hero"><h2>Prep list</h2><p>Close tonight by writing tomorrow's prep. Tomorrow's kitchen can simply tick items off.</p></div><div class="toolbar"><label>Prep date <input id="date" type="date"></label><label>View <select id="section"><option value="ALL">All sections</option><option value="S1">Section 1</option><option value="S2">Section 2</option></select></label><button class="btn light" id="tomorrow">TOMORROW</button><button class="btn warn" id="carry">CARRY UNFINISHED FORWARD</button></div><div class="add"><div class="addgrid"><input class="wide" id="item" placeholder="Prep item, e.g. slice bulgogi beef"><input id="qty" placeholder="Qty, e.g. 3 trays"><select id="itemSection"><option value="ALL">All kitchen</option><option value="S1">Section 1</option><option value="S2">Section 2</option></select><button class="btn" id="add">ADD</button></div><textarea id="notes" rows="2" placeholder="Optional note" style="width:100%;margin-top:8px"></textarea></div><div class="progress"><div class="summary" id="summary">0 / 0 complete</div><div class="track"><div class="fill" id="fill"></div></div></div><div id="list"></div></main><div class="toast" id="toast"></div><script>(()=>{'use strict';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sydDate=(add=0)=>{let d=new Date(Date.now()+add*86400000);return d.toLocaleDateString('en-CA',{timeZone:'Australia/Sydney'})};$('#date').value=sydDate(1);let items=[];function toast(s){let e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1500)}async function post(body){let r=await fetch('/api/ops/prep',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error((await r.json().catch(()=>({}))).error||'Save failed');return r.json()}function render(){let done=items.filter(x=>x.completed).length,pct=items.length?Math.round(done/items.length*100):0;$('#summary').textContent=`${done} / ${items.length} complete`;$('#fill').style.width=pct+'%';if(!items.length){$('#list').innerHTML='<div class="empty">No prep items yet. Add tomorrow\'s prep above.</div>';return}let groups=[...new Set(items.map(x=>x.section||'ALL'))];$('#list').innerHTML=groups.map(g=>`<div class="section">${g==='S1'?'SECTION 1':g==='S2'?'SECTION 2':'ALL KITCHEN'}</div>`+items.filter(x=>(x.section||'ALL')===g).map(x=>`<div class="task ${x.completed?'done':''}"><button class="check" data-id="${x.id}">${x.completed?'✓':'○'}</button><div><h3>${esc(x.item)}${x.quantity?` · ${esc(x.quantity)}`:''}</h3><p>${esc(x.notes||'')}${x.completed_by?` · Done by ${esc(x.completed_by)}`:''}</p></div><span class="tag">${esc(x.section||'ALL')}</span></div>`).join('')).join('');document.querySelectorAll('.check').forEach(b=>b.onclick=()=>toggle(Number(b.dataset.id)))}async function toggle(id){let x=items.find(i=>Number(i.id)===id);if(!x)return;let by=localStorage.getItem('bbqCompletedBy')||'';if(!x.completed&&!by){by=prompt('Your name:','')||'';if(!by.trim())return;localStorage.setItem('bbqCompletedBy',by.trim())}try{await post({action:'toggle',id,completed:!x.completed,completedBy:by});load()}catch(e){toast(e.message)}}async function load(){try{let q=new URLSearchParams({date:$('#date').value,section:$('#section').value});let r=await fetch('/api/ops/prep?'+q,{cache:'no-store'});let d=await r.json();items=d.items||[];render()}catch{toast('Unable to load prep list')}}$('#add').onclick=async()=>{let item=$('#item').value.trim();if(!item){toast('Enter prep item');return}try{await post({action:'add',prepDate:$('#date').value,section:$('#itemSection').value,item,quantity:$('#qty').value,notes:$('#notes').value,createdBy:localStorage.getItem('bbqCompletedBy')||''});$('#item').value=$('#qty').value=$('#notes').value='';load()}catch(e){toast(e.message)}};$('#tomorrow').onclick=()=>{$('#date').value=sydDate(1);load()};$('#carry').onclick=async()=>{let from=$('#date').value,to=new Date(Date.parse(from+'T00:00:00Z')+86400000).toISOString().slice(0,10);if(!confirm(`Copy all unfinished items from ${from} to ${to}?`))return;try{await post({action:'carry',fromDate:from,toDate:to,createdBy:localStorage.getItem('bbqCompletedBy')||''});$('#date').value=to;load();toast('Unfinished items carried forward')}catch(e){toast(e.message)}};$('#date').onchange=load;$('#section').onchange=load;load()})();</script></body></html>
