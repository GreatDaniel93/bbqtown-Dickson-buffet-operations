function header(title,sub,bulk=false){return `<div class="hero"><div><h2>${title}</h2><p>${sub}</p></div>${bulk?'<button class="batch-launch" data-bulk aria-label="全部上架，统一开始56个菜品计时"><span class="batch-launch-icon">↑</span><span class="batch-launch-copy"><strong>全部上架</strong><small>56 道菜 · 同时开始计时</small></span><span class="batch-launch-arrow">›</span></button>':''}</div>`}
function summary(){let req=state.foods.filter(f=>f.kitchen!=='idle').length;return `<div class="summary"><div class="stat"><b>${state.foods.filter(f=>f.status==='GOOD').length}</b><span>GOOD 正常</span></div><div class="stat"><b>${state.foods.filter(f=>f.status==='LOW').length}</b><span>LOW 需要准备</span></div><div class="stat"><b>${state.foods.filter(f=>f.status==='EMPTY').length}</b><span>EMPTY 紧急</span></div><div class="stat"><b>${req}</b><span>厨房任务</span></div></div>`}
function foh(){let cats=['All','Hot Food','Meat','Seafood','Veg & Side'];let q=(state.query||'').toLowerCase();let foods=state.foods.filter(f=>(state.category==='All'||f.category===state.category)&&(!q||f.name.toLowerCase().includes(q)||CN_NAMES[f.id-1].includes(q)));app.innerHTML=header('Buffet Floor','Tap one clear status. LOW and EMPTY notify the correct kitchen automatically.',true)+summary()+`<div class="tools">${cats.map(c=>`<button class="chip ${state.category===c?'active':''}" data-cat="${c}">${c==='All'?'ALL 56':c.toUpperCase()}</button>`).join('')}<input class="search" data-search placeholder="Search food…" value="${esc(state.query||'')}"></div><div class="grid">${foods.map(card).join('')}</div>`;wire()}
function card(f){let p=phase(f),bc=f.status==='GOOD'?'b-good':f.status==='LOW'?'b-low':'b-empty';return `<article class="card"><div class="card-head"><div><div class="food-name">${esc(f.name)}</div><div class="meta">${esc(f.category)} · Section ${f.section}</div></div><span class="badge ${bc}">${f.status}</span></div><div class="timer"><span>Batch ${time(f.start)}</span><strong class="${p==='RED'?'b-red':''}">${timerText(f)}</strong></div>${f.kitchen==='ready'?`<div style="margin:0 0 10px;padding:12px;border-radius:11px;background:var(--green-bg);color:var(--green);font-weight:900;text-align:center">✓ KITCHEN READY TO REFILL</div><button class="bulk" style="width:100%;margin-bottom:10px" data-floor-refill="${f.id}">REFILLED · START NEW BATCH</button>`:`<div class="actions"><button class="good ${f.status==='GOOD'?'selected':''}" data-status="GOOD" data-id="${f.id}">✓ GOOD</button><button class="low ${f.status==='LOW'?'selected':''}" data-status="LOW" data-id="${f.id}">◐ LOW</button><button class="empty ${f.status==='EMPTY'?'selected':''}" data-status="EMPTY" data-id="${f.id}">! EMPTY</button></div>`}${p==='RED'?`<button class="bulk" style="width:100%;margin-top:9px;background:var(--red)" data-four="${f.id}">Record 4-Hour Action</button>`:''}</article>`}
function kitchen(sec){let tasks=state.foods.filter(f=>f.section===sec&&f.kitchen!=='idle');let groups=[['requested','NEW REQUESTS'],['preparing','PREPARING'],['ready','READY TO REFILL']];app.innerHTML=header(`Section ${sec} Kitchen`,sec===1?'Hot food · Meat · Seafood':'Vegetables · Side dishes · Fruit · Dessert')+`<div class="summary"><div class="stat"><b>${tasks.filter(f=>f.status==='EMPTY').length}</b><span>URGENT EMPTY</span></div><div class="stat"><b>${tasks.filter(f=>f.kitchen==='requested').length}</b><span>NEW</span></div><div class="stat"><b>${tasks.filter(f=>f.kitchen==='preparing').length}</b><span>PREPARING</span></div><div class="stat"><b>${tasks.filter(f=>f.kitchen==='ready').length}</b><span>READY</span></div></div><div class="kcolumns">${groups.map(([k,label])=>`<section class="kcol"><div class="khead"><span>${label}</span><span class="badge b-good">${tasks.filter(f=>f.kitchen===k).length}</span></div>${tasks.filter(f=>f.kitchen===k).sort((a,b)=>(b.status==='EMPTY')-(a.status==='EMPTY')).map(task).join('')||'<div class="empty-state">No tasks</div>'}</section>`).join('')}</div>`;wire()}
function task(f){let next=f.kitchen==='requested'?'START PREPARING':'MARK READY TO REFILL';return `<article class="task ${f.status==='EMPTY'?'urgent':''} ${f.kitchen==='ready'?'ready':''}"><h3>${esc(f.name)}</h3><p>${f.status==='EMPTY'?'🔴 EMPTY · URGENT':'🟠 LOW · Prepare next tray'}<br>Requested ${time(state.logs.find(l=>l.food===f.name)?.at||Date.now())}</p>${f.kitchen==='ready'?'<div style="padding:12px;border-radius:10px;background:var(--green-bg);color:var(--green);font-weight:900;text-align:center">✓ READY · Waiting for FOH</div>':`<button data-kitchen="${f.id}">${next}</button>`}</article>`}
function manager(){let live=`<div class="grid">${state.foods.map(f=>`<article class="card"><div class="food-name">${esc(f.name)}</div><div class="meta">Section ${f.section} · Started ${time(f.start)}</div><div class="timer"><span>${phase(f)} zone</span><strong>${timerText(f)}</strong></div></article>`).join('')}</div>`;let history=`<div style="margin-bottom:10px"><button class="chip" data-csv>Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Date / Time</th><th>Action</th><th>Food</th><th>Section</th><th>Details</th></tr></thead><tbody>${state.logs.map(l=>`<tr><td>${date(l.at)} ${time(l.at)}</td><td><strong>${esc(l.action)}</strong></td><td>${esc(l.food)}</td><td>${l.section}</td><td>${esc(l.detail)}</td></tr>`).join('')||'<tr><td colspan="5">No records yet.</td></tr>'}</tbody></table></div>`;let setup=`<div class="table-wrap">${state.foods.map(f=>`<div class="setup-row"><div><strong>${esc(f.name)}</strong><div class="meta">${f.category}</div></div><select data-section="${f.id}"><option value="1" ${f.section===1?'selected':''}>Section 1</option><option value="2" ${f.section===2?'selected':''}>Section 2</option></select></div>`).join('')}</div>`;app.innerHTML=header('Manager Dashboard','Live 2 / 4 hour food safety status and traceable action records.',true)+summary()+`<div class="tabs"><button data-mgr="live" class="${state.mgrTab==='live'?'active':''}">Live Safety</button><button data-mgr="history" class="${state.mgrTab==='history'?'active':''}">History</button><button data-mgr="setup" class="${state.mgrTab==='setup'?'active':''}">Food Setup</button></div>${state.mgrTab==='live'?live:state.mgrTab==='history'?history:setup}`;wire()}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));if(state.view==='foh')foh();else if(state.view==='s1')kitchen(1);else if(state.view==='s2')kitchen(2);else manager();translatePage();save()}
function confirmBulk(){modal.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>上架全部 56 个菜品？</h2><p>This will close every current batch and start all 56 dishes together with the same new start time.</p><div class="warning">⚠ All current 2 / 4 hour timers will restart. This action will be recorded in Manager History.</div><div class="dialog-actions"><button data-cancel>Cancel</button><button class="confirm" data-confirm-bulk>CONFIRM · START ALL</button></div></div></div>`;translateContainer(modal);modal.querySelector('[data-cancel]').onclick=()=>modal.innerHTML='';modal.querySelector('[data-confirm-bulk]').onclick=()=>{let now=Date.now();state.foods.forEach(f=>{f.start=now;f.status='GOOD';f.kitchen='idle'});log('BULK START · 56 NEW BATCHES',null,`All items started together at ${time(now)}; all 2/4 hour timers reset`);modal.innerHTML='';render();toast(state.lang==='zh'?'✓ 56道菜已全部上架':'✓ All 56 dishes are now on display')};}
function four(id){let f=state.foods.find(x=>x.id===id);modal.innerHTML=`<div class="overlay"><div class="dialog"><h2>4-Hour Action · ${esc(displayName(f))}</h2><p>The old batch must be closed before a new timer starts.</p><div class="dialog-actions"><button data-action="DISCARDED">Discard + New Batch</button><button class="confirm" data-action="REPLACED">Replace + New Batch</button><button data-cancel style="grid-column:1/-1">Cancel</button></div></div></div>`;translateContainer(modal);modal.querySelector('[data-cancel]').onclick=()=>modal.innerHTML='';modal.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{log(`${b.dataset.action} AT 4-HOUR ACTION`,f,`Previous batch closed after ${duration(mins(f))}`);f.start=Date.now();f.status='GOOD';f.kitchen='idle';log('NEW BATCH STARTED',f,'2/4 hour timer started');modal.innerHTML='';render()})}
function csv(){let rows=[['Date/Time','Action','Food','Section','Details'],...state.logs.map(l=>[new Date(l.at).toLocaleString(),l.action,l.food,l.section,l.detail])];let blob=new Blob([rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BBQ-Town-Food-Safety-Log.csv';a.click();URL.revokeObjectURL(a.href)}
function wire(){document.querySelectorAll('[data-bulk]').forEach(b=>b.onclick=confirmBulk);document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;render()});let s=document.querySelector('[data-search]');if(s)s.oninput=e=>{state.query=e.target.value;foh();translatePage()};document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{let f=state.foods.find(x=>x.id==b.dataset.id),old=f.status;f.status=b.dataset.status;if(f.status==='LOW'||f.status==='EMPTY')f.kitchen=f.kitchen==='idle'?'requested':f.kitchen;else if(old!=='GOOD'&&f.kitchen==='requested')f.kitchen='idle';log(`${f.status} STATUS`,f,f.status==='EMPTY'?'Urgent kitchen request':f.status==='LOW'?'Prepare next tray':'Floor confirmed display is good');render();toast(`${displayName(f)} · ${state.lang==='zh'?{'GOOD':'正常','LOW':'不足','EMPTY':'空盘'}[f.status]:f.status}`)});document.querySelectorAll('[data-kitchen]').forEach(b=>b.onclick=()=>{let f=state.foods.find(x=>x.id==b.dataset.kitchen);if(f.kitchen==='requested'){f.kitchen='preparing';log('PREPARING STARTED',f)}else if(f.kitchen==='preparing'){f.kitchen='ready';log('READY TO REFILL',f,'Kitchen finished; waiting for FOH confirmation')}render()});document.querySelectorAll('[data-floor-refill]').forEach(b=>b.onclick=()=>{let f=state.foods.find(x=>x.id==b.dataset.floorRefill);log('OLD BATCH REPLACED BY FOH',f,`Closed after ${duration(mins(f))}`);f.kitchen='idle';f.status='GOOD';f.start=Date.now();log('NEW BATCH STARTED BY FOH',f,'Refilled on floor; 2/4 hour timer started');render();toast(state.lang==='zh'?`✓ ${displayName(f)}已补菜，新计时开始`:`✓ ${f.name} refilled · new timer started`)});document.querySelectorAll('[data-mgr]').forEach(b=>b.onclick=()=>{state.mgrTab=b.dataset.mgr;render()});document.querySelectorAll('[data-section]').forEach(s=>s.onchange=()=>{let f=state.foods.find(x=>x.id==s.dataset.section);f.section=+s.value;log('SECTION CHANGED',f,`Assigned to Section ${f.section}`);render()});document.querySelector('[data-csv]')?.addEventListener('click',csv);document.querySelectorAll('[data-four]').forEach(b=>b.onclick=()=>four(+b.dataset.four))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render()});document.querySelector('#langToggle').onclick=()=>{state.lang=state.lang==='en'?'zh':'en';state.query='';render()};function clock(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,1000);tick=setInterval(render,60000);setInterval(pollCloud,3000);render();loadCloud();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script></body></html>
