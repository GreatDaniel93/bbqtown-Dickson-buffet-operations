<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BBQ Town Buffet Operations</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:#172018;font:15px system-ui}.top{position:sticky;top:0;background:#142219;color:#fff;padding:14px;z-index:2}.head,.nav,main{max-width:1400px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.head h1{margin:0;font-size:20px}.head button,.nav button{border:1px solid #ffffff44;border-radius:10px;background:#ffffff15;color:#fff;padding:11px 16px;font-weight:800}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.nav button.on{background:#fff;color:#142219}main{padding:18px}.hero{display:flex;justify-content:space-between;align-items:center;gap:12px}.bulk{border:0;border-radius:14px;padding:15px 20px;background:#178447;color:#fff;font-weight:900}.filters{display:flex;gap:8px;overflow:auto;margin:15px 0}.filters button{padding:11px 16px;border:1px solid #dce3dc;border-radius:20px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.col{background:#fff;border:1px solid #dce3dc;border-radius:16px;padding:15px}.name{font-size:18px;font-weight:900}.meta{color:#647067;font-size:12px;margin:4px 0 12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions button,.task button{min-height:52px;border:0;border-radius:11px;font-weight:900}.good{background:#e8f6ed;color:#178447}.low{background:#fff1d5;color:#9b5b00}.empty{background:#c52f2f;color:#fff}.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.task{border-left:6px solid #b56800;background:#fff;margin-top:10px;padding:13px;border-radius:12px}.task.ready{border-color:#178447}.task button{width:100%;background:#142219;color:#fff}.readyBox{background:#e8f6ed;color:#178447;padding:12px;text-align:center;font-weight:900;border-radius:10px}.table{overflow:auto;background:#fff;border-radius:14px}table{width:100%;border-collapse:collapse}td,th{padding:11px;border-bottom:1px solid #ddd;text-align:left}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.hero{align-items:stretch;flex-direction:column}.bulk{width:100%}}
</style></head><body><header class="top"><div class="head"><h1>BBQ TOWN</h1><button id="lang">中文</button></div><nav class="nav" id="nav"></nav></header><main id="app"></main>
<script>
const RAW=[
['Fried Rice','炒饭','Hot',1],['Japchae','韩式炒粉丝','Hot',1],['Fried Hokkien Noodles','炒福建面','Hot',1],['Spicy Rice Cake','辣炒年糕','Hot',1],['Bulgogi / Mongolian Beef','韩式烤牛肉／蒙古牛肉','Hot',1],['Honey Chicken','蜜糖鸡','Hot',1],['Sweet & Sour Pork','咕咾肉','Hot',1],['Mixed Stir-Fry Vegetables','炒杂菜','Hot',1],['Fried Chicken','炸鸡','Hot',1],['Fried Dumplings','炸饺子','Hot',1],['Chips & Nuggets','薯条和鸡块','Hot',1],['Fried Seaweed Rolls','炸紫菜卷','Hot',1],['Takoyaki Balls','章鱼小丸子','Hot',1],['Fried Kimchi Pancake','炸泡菜饼','Hot',1],['Fried Spring Rolls','炸春卷','Hot',1],['Vegetable Samosas','蔬菜咖喱角','Hot',1],['Fried Mantou','炸馒头','Hot',1],
['Scotch Fillet','西冷牛排','Meat',1],['Oyster Blade / Rib Eye Cap','板腱／肋眼盖','Meat',1],['Intercostal','牛肋条','Meat',1],['Brisket','牛胸肉','Meat',1],['Inside Skirt','内裙肉','Meat',1],['Ox Tongue','牛舌','Meat',1],['LA Short Rib','洛杉矶牛小排','Meat',1],['Lamb Shoulder','羊肩肉','Meat',1],['Lamb Cutlet','羊排','Meat',1],['Soy Chicken','酱油鸡','Meat',1],['Spicy Chicken','辣鸡肉','Meat',1],['Pork Belly','五花肉','Meat',1],['Spicy Pork Belly','辣五花肉','Meat',1],['Pork Jowl','猪颈肉','Meat',1],['Marinated Pork Neck','腌猪颈肉','Meat',1],['Bolar Blade','牛肩胛肉','Meat',1],['Marinated Angus Flap Meat','腌安格斯腹肉','Meat',1],['Tri-Tip','三角牛排','Meat',1],['Outside Top','牛后腿外侧肉','Meat',1],
['Prawn','虾','Seafood',1],['Mussels','青口贝','Seafood',1],['Baby Octopus','小章鱼','Seafood',1],['Squid Legs / Rings','鱿鱼须／鱿鱼圈','Seafood',1],
['Cheese Corn','芝士玉米','Side',2],['Butter Enoki Mushroom','黄油金针菇','Side',2],['Green Coral Lettuce','绿珊瑚生菜','Side',2],['Iceberg Lettuce','冰山生菜','Side',2],['Cabbage Salad','卷心菜沙拉','Side',2],['Zucchini','西葫芦','Side',2],['Enoki Mushroom','金针菇','Side',2],['King Oyster Mushroom','杏鲍菇','Side',2],['Green Capsicum','青椒','Side',2],['Red Capsicum','红椒','Side',2],['Pumpkin','南瓜','Side',2],['Sweet Potato','红薯','Side',2],['Carrot','胡萝卜','Side',2],['Red Bean Buns','豆沙包','Side',2],['Cake','蛋糕','Side',2],['Watermelon','西瓜','Side',2]];
let local=JSON.parse(localStorage.getItem('bbq-ui')||'{}'),lang=local.lang||'en',view=local.view||'foh',cat='All',updated=0;
let foods=RAW.map((x,i)=>({id:i+1,name:x[0],category:x[2],section:x[3],status:'GOOD',kitchen:'idle',start:Date.now()})),logs=[];
const T=(en,zh)=>lang==='zh'?zh:en,N=f=>lang==='zh'?RAW[f.id-1][1]:f.name,save=()=>{localStorage.setItem('bbq-ui',JSON.stringify({lang,view}));sync()};
async function load(){try{let r=await fetch('/api/state',{cache:'no-store'}),d=await r.json();if(d.state){foods=d.state.foods;logs=d.state.logs;updated=d.updatedAt;render()}else sync()}catch{}}
async function sync(){try{let r=await fetch('/api/state',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({foods,logs})}),d=await r.json();updated=d.updatedAt||updated}catch{}}
async function poll(){try{let d=await(await fetch('/api/state',{cache:'no-store'})).json();if(d.updatedAt>updated){foods=d.state.foods;logs=d.state.logs;updated=d.updatedAt;render()}}catch{}}
function log(action,f){logs.unshift({at:Date.now(),action,food:f?f.name:'All 56 items',section:f?'Section '+f.section:'All Sections',detail:''});logs=logs.slice(0,1000)}
function setStatus(id,status){let f=foods.find(x=>x.id===id);f.status=status;if(status!=='GOOD'&&f.kitchen==='idle')f.kitchen='requested';log(status+' STATUS',f);save();render()}
function kAction(id){let f=foods.find(x=>x.id===id);if(f.kitchen==='requested'){f.kitchen='preparing';log('PREPARING STARTED',f)}else if(f.kitchen==='preparing'){f.kitchen='ready';log('READY TO REFILL',f)}save();render()}
function refill(id){let f=foods.find(x=>x.id===id);f.kitchen='idle';f.status='GOOD';f.start=Date.now();log('NEW BATCH STARTED BY FOH',f);save();render()}
function bulk(){if(!confirm(T('Start all 56 new batches?','确认全部56道菜同时上架？')))return;let now=Date.now();foods.forEach(f=>{f.start=now;f.status='GOOD';f.kitchen='idle'});log('BULK START · 56 NEW BATCHES');save();render()}
function card(f){return `<article class="card"><div class="name">${N(f)}</div><div class="meta">${T(f.category,{Hot:'热菜',Meat:'肉类',Seafood:'海鲜',Side:'蔠菜和配菜'}[f.category])} · ${T('Section ','区')}${f.section}</div>${f.kitchen==='ready'?`<div class="readyBox">${T('KITCHEN READY','厨房已备好')}</div><button class="bulk" onclick="refill(${f.id})">${T('REFILLED · NEW BATCH','已补菜 · 新计时')}</button>`:`<div class="actions"><button class="good" onclick="setStatus(${f.id},'GOOD')">${T('GOOD','正常')}</button><button class="low" onclick="setStatus(${f.id},'LOW')">${T('LOW','不足')}</button><button class="empty" onclick="setStatus(${f.id},'EMPTY')">${T('EMPTY','空盘')}</button></div>`}</article>`}
function foh(){let list=foods.filter(f=>cat==='All'||f.category===cat);return `<div class="hero"><div><h2>${T('Buffet Floor','外场补菜')}</h2><p>${T('LOW and EMPTY notify the kitchen.','不足和空盘会通知厨房。')}</p></div><button class="bulk" onclick="bulk()">${T('START ALL 56 BATCHES','全部上架')}</button></div><div class="filters">${['All','Hot','Meat','Seafood','Side'].map(c=>`<button onclick="cat='${c}';render()">${T(c,{All:'全部',Hot:'热菜',Meat:'肉类',Seafood:'海鲜',Side:'蔬菜和配菜'}[c])}</button>`).join('')}</div><div class="grid">${list.map(card).join('')}</div>`}
function kitchen(sec){let tasks=foods.filter(f=>f.section===sec&&f.kitchen!=='idle'),groups=['requested','preparing','ready'];return `<h2>${T('Section '+sec+' Kitchen',sec+'区厨房')}</h2><div class="cols">${groups.map(g=>`<section class="col"><b>${T({requested:'NEW REQUESTS',preparing:'PREPARING',ready:'READY TO REFILL'}[g],{requested:'新任务',preparing:'制作中',ready:'可以补菜'}[g])}</b>${tasks.filter(f=>f.kitchen===g).map(f=>`<div class="task ${g}"><div class="name">${N(f)}</div><div class="meta">${f.status}</div>${g==='ready'?'<div class="readyBox">'+T('Waiting for FOH','等待外场确认')+'</div>':`<button onclick="kAction(${f.id})">${g==='requested'?T('START PREPARING','开始准备'):T('MARK READY','标记已备好')}</button>`}</div>`).join('')}</section>`).join('')}</div>`}
function manager(){return `<h2>${T('Manager History','经理后台')}</h2><div class="table"><table><tr><th>${T('Time','时间')}</th><th>${T('Action','操作')}</th><th>${T('Food','菜品')}</th></tr>${logs.map(l=>`<tr><td>${new Date(l.at).toLocaleString()}</td><td>${l.action}</td><td>${lang==='zh'?(RAW.find(x=>x[0]===l.food)?.[1]||l.food):l.food}</td></tr>`).join('')}</table></div>`}
function render(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelector('#lang').textContent=lang==='zh'?'English':'中文';let views=[['foh','FOH','外场'],['s1','SECTION 1','一区'],['s2','SECTION 2','二区'],['manager','MANAGER','经理后台']];document.querySelector('#nav').innerHTML=views.map(x=>`<button class="${view===x[0]?'on':''}" onclick="view='${x[0]}';save();render()">${lang==='zh'?x[2]:x[1]}</button>`).join('');document.querySelector('#app').innerHTML=view==='foh'?foh():view==='s1'?kitchen(1):view==='s2'?kitchen(2):manager()}
document.querySelector('#lang').onclick=()=>{lang=lang==='en'?'zh':'en';save();render()};render();load();setInterval(poll,3000);
</script></body></html>
