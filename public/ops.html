const cloudPayload=()=>({foods:state.foods,logs:state.logs,workflow:state.workflow});const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));if(!cloudReady)return;let next=JSON.stringify(cloudPayload());if(next===cloudHash)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>syncCloud(next),180)};async function syncCloud(serialized){try{let res=await fetch('/api/state',{method:'POST',headers:{'content-type':'application/json'},body:serialized});if(!res.ok)throw Error('sync failed');let data=await res.json();cloudHash=serialized;cloudUpdatedAt=data.updatedAt||Date.now()}catch(e){console.warn('Cloud sync will retry',e)}}function applyCloud(data){state.foods=data.state.foods;state.logs=Array.isArray(data.state.logs)?data.state.logs:[];state.workflow={newTaskMinutes:Math.max(1,Number(data.state.workflow?.newTaskMinutes)||5),readyMinutes:Math.max(1,Number(data.state.workflow?.readyMinutes)||3)};cloudHash=JSON.stringify(cloudPayload())}async function loadCloud(){try{let res=await fetch('/api/state',{cache:'no-store'});if(!res.ok)throw Error('load failed');let data=await res.json();cloudReady=true;cloudUpdatedAt=data.updatedAt||0;if(Array.isArray(data.state?.foods)&&data.state.foods.length){applyCloud(data);render()}else{syncCloud(JSON.stringify(cloudPayload()))}}catch(e){console.warn('Cloud database unavailable',e)}}async function pollCloud(){if(!cloudReady)return loadCloud();try{let res=await fetch('/api/state',{cache:'no-store'});if(!res.ok)return;let data=await res.json();if(data.updatedAt>cloudUpdatedAt&&Array.isArray(data.state?.foods)&&data.state.foods.length){cloudUpdatedAt=data.updatedAt;applyCloud(data);render()}}catch(e){}}const mins=f=>Math.max(0,Math.floor((Date.now()-f.start)/60000));const duration=m=>`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;const phase=f=>mins(f)>=240?'RED':mins(f)>=120?'YELLOW':'GREEN';const time=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});const date=t=>new Date(t).toLocaleDateString([ function task(f){let next=f.kitchen==='requested'?'START PREPARING':'MARK READY TO REFILL',zh=state.lang==='zh',late=overdue(f),stage=f.kitchen==='ready'?(zh?'等待外场补菜':'Waiting for FOH refill'):(zh?'等待厨房处理':'Waiting for kitchen action');return `<article class="task ${f.status==='EMPTY'?'urgent':''} ${f.kitchen==='ready'?'ready':''}" style="${late?'border-top:2px solid var(--red);background:#fff7f6':''}"><h3>${esc(f.name)}</h3><p>${f.status==='EMPTY'?'🔴 EMPTY · URGENT':'🟠 LOW · Prepare next tray'}<br>${stage} · ${taskMinutes(f)} min${late?` <strong style="color:var(--red)">${zh?'· 已超时':'· OVERDUE'}</strong>`:''}</p>${f.kitchen==='ready'?'<div style="padding:12px;border-radius:10px;background:var(--green-bg);color:var(--green);font-weight:900;text-align:center">✓ READY · Waiting for FOH</div>':`<button data-kitchen="${f.id}">${next}</button>`}</article>`}
function manager(){let zh=state.lang==='zh';if(!managerAuthorized){app.innerHTML=`<div class="hero"><div><h2>${zh?'经理后台':'Manager Dashboard'}</h2><p>${zh?'请输入 Manager PIN 后查看和管理后台。':'Enter the Manager PIN to view and manage this area.'}</p></div></div><section class="card" style="max-width:480px;margin:42px auto"><h2 style="margin-top:0">${zh?'Manager PIN':'Manager PIN'}</h2><input data-manager-pin type="password" inputmode="numeric" placeholder="PIN" style="width:100%;min-height:56px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:20px;margin:10px 0"><button class="bulk" style="width:100%" data-manager-login>${zh?'解锁后台':'UNLOCK MANAGER'}</button></section>`;wire();return}let live=`<div class="grid manager-live">${state.foods.map(f=>`<article class="card"><div class="food-name">${esc(displayName(f))}</div><div class="meta">${state.lang==='zh'?`${f.section}区`:`Section ${f.section}`} · ${state.lang==='zh'?'开始':'Started'} ${time(f.start)}</div><div class="timer"><span>${phase(f)} ${state.lang==='zh'?'状态':'zone'}</span><strong>${timerText(f)}</strong></div></article>`).join('')}</div>`;let history=`<div style="margin-bottom:10px"><button class="chip" data-csv>Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Date / Time</th><th>Action</th><th>Food</th><th>Section</th><th>Details</th></tr></thead><tbody>${state.logs.map(l=>`<tr><td>${date(l.at)} ${time(l.at)}</td><td><strong>${esc(l.action)}</strong></td><td>${esc(l.food)}</td><td>${l.section}</td><td>${esc(l.detail)}</td></tr>`).join('')||'<tr><td colspan="5">No records yet.</td></tr>'}</tbody></table></div>`;let setup=`<div style="margin-bottom:12px"><button class="bulk" data-add-dish>${zh?'＋ 新增菜品':'＋ ADD DISH'}</button></div><div class="table-wrap">${state.foods.map(f=>`<div class="setup-row"><div><strong>${esc(displayName(f))}</strong><div class="meta">${esc(catName(f.category))} · ${zh?'英文：':''}${esc(f.name)}</div></div><div style="display:flex;gap:8px;align-items:center"><select data-section="${f.id}"><option value="1" ${f.section===1?'selected':''}>${zh?'1区':'Section 1'}</option><option value="2" ${f.section===2?'selected':''}>${zh?'2区':'Section 2'}</option></select><button class="chip" data-delete-dish="${f.id}" style="min-height:42px;padding:0 13px;color:var(--red);border-color:#efc2bd">${zh?'删除':'DELETE'}</button></div></div>`).join('')}</div>`;app.innerHTML=header('Manager Dashboard','Live 2 / 4 hour food safety status and traceable action records.',true)+summary()+`<div class="tabs"><button data-mgr="live" class="${state.mgrTab==='live'?'active':''}">Live Safety</button><button data-mgr="history" class="${state.mgrTab==='history'?'active':''}">History</button><button data-mgr="setup" class="${state.mgrTab==='setup'?'active':''}">Food Setup</button><button data-workflow-settings>${zh?'补菜时限':'REFILL LIMITS'}</button></div>${state.mgrTab==='live'?live:state.mgrTab==='history'?history:setup}`;wire()}
function openWorkflowSettings(){let zh=state.lang==='zh';modal.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>${zh?'补菜时限设置':'Refill time limits'}</h2><p>${zh?'超时只会在厨房页面触发提示；外场会显示优先处理清单。':'Overdue alerts appear on kitchen screens only; FOH shows the priority list.'}</p><label style="display:grid;gap:7px;font-weight:800;margin:15px 0">${zh?'新任务多久未开始准备即提醒（分钟）':'Alert if a new task is not started within (minutes)'}<input data-limit-new type="number" min="1" max="60" value="${state.workflow.newTaskMinutes}" style="min-height:52px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit"></label><label style="display:grid;gap:7px;font-weight:800;margin:15px 0">${zh?'厨房已备好多久未补菜即提醒（分钟）':'Alert if ready food is not refilled within (minutes)'}<input data-limit-ready type="number" min="1" max="60" value="${state.workflow.readyMinutes}" style="min-height:52px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit"></label><div class="dialog-actions"><button data-cancel>${zh?'取消':'Cancel'}</button><button class="confirm" data-save-workflow>${zh?'保存设置':'SAVE LIMITS'}</button></div></div></div>`;modal.querySelector('[data-cancel]').onclick=()=>modal.innerHTML='';modal.querySelector('[data-save-workflow]').onclick=()=>{let nextNew=Math.max(1,Math.min(60,Number(modal.querySelector('[data-limit-new]').value)||5)),nextReady=Math.max(1,Math.min(60,Number(modal.querySelector('[data-limit-ready]').value)||3));state.workflow={newTaskMinutes:nextNew,readyMinutes:nextReady};log('REFILL LIMITS UPDATED',null,`New task ${nextNew} min; ready-to-refill ${nextReady} min`);modal.innerHTML='';render();toast(zh?'✓ 补菜时限已保存':'✓ Refill limits saved')}}
function render(){document.body.dataset.view=state.view;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));if(state.view==='foh')foh();else if(state.view==='s1')kitchen(1);else if(state.view==='s2')kitchen(2);else manager();translatePage();checkKitchenAlert();save()}
function addDish(){let zh=state.lang==='zh',title=zh?'新增菜品':'Add dish',confirm=zh?'确认新增':'ADD DISH';modal.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>${title}</h2><p>${zh?'新增后会同步至所有平板，并开始新的2／4小时计时。':'The new dish syncs to all tablets and starts a new 2 / 4-hour timer.'}</p><div style="display:grid;gap:10px"><input data-new-name placeholder="${zh?'英文菜名（必填）':'Dish name in English (required)'}" style="min-height:50px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit"><input data-new-zh placeholder="${zh?'中文菜名（可选）':'Chinese name (optional)'}" style="min-height:50px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit"><select data-new-category style="min-height:50px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit"><option>Hot Food</option><option>Meat</option><option>Seafood</option><option>Veg & Side</option></select><select data-new-section style="min-height:50px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit"><option value="1">${zh?'1区厨房':'Section 1'}</option><option value="2">${zh?'2区厨房':'Section 2'}</option></select></div><div class="dialog-actions"><button data-cancel>${zh?'取消':'Cancel'}</button><button class="confirm" data-confirm-add>${confirm}</button></div></div></div>`;modal.querySelector('[data-cancel]').onclick=()=>modal.innerHTML='';modal.querySelector('[data-confirm-add]').onclick=()=>{let name=modal.querySelector('[data-new-name]').value.trim(),zhName=modal.querySelector('[data-new-zh]').value.trim(),category=modal.querySelector('[data-new-category]').value,section=+modal.querySelector('[data-new-section]').value;if(!name){toast(zh?'请输入英文菜名':'Enter an English dish name');return}if(state.foods.some(f=>f.name.toLowerCase()===name.toLowerCase())){toast(zh?'该菜品已存在':'This dish already exists');return}let food={id:Math.max(0,...state.foods.map(f=>Number(f.id)||0))+1,name,zh:zhName,category,section,status:'GOOD',kitchen:'idle',start:Date.now()};state.foods.push(food);log('DISH ADDED',food,`Added by Manager · ${category}`);modal.innerHTML='';render();toast(zh?'✓ 菜品已新增':'✓ Dish added')};}
function deleteDish(id){let f=state.foods.find(x=>x.id==id);if(!f)return;let zh=state.lang==='zh',title=zh?`删除「${displayName(f)}」？`:`Delete “${f.name}”?`;modal.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><p>${zh?'此操作会从所有平板移除该菜品。历史记录会保留。':'This removes the dish from every tablet. Its existing history stays recorded.'}</p><div class="warning">${zh?'⚠ 请确认该菜品当前不需要厨房处理。':'⚠ Confirm this dish does not have an active kitchen task.'}</div><div class="dialog-actions"><button data-cancel>${zh?'取消':'Cancel'}</button><button class="confirm" style="background:var(--red);border-color:var(--red)" data-confirm-delete>${zh?'确认删除':'DELETE DISH'}</button></div></div></div>`;modal.querySelector('[data-cancel]').onclick=()=>modal.innerHTML='';modal.querySelector('[data-confirm-delete]').onclick=()=>{log('DISH REMOVED',f,'Removed by Manager');state.foods=state.foods.filter(x=>x.id!==f.id);modal.innerHTML='';render();toast(zh?'✓ 菜品已删除':'✓ Dish deleted')}}
function confirmBulk(){let n=state.foods.length,zh=state.lang==='zh';modal.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>${zh?`上架全部 ${n} 个菜品？`:`Start all ${n} items?`}</h2><p>${zh?'这会结束所有当前批次，并让所有菜品以相同时间开始新批次。':`This closes every current batch and starts all ${n} dishes with the same new time.`}</p><div class="warning">${zh?'⚠ 所有两小时／四小时计时将重新开始，并记录在经理后台。':'⚠ All current 2 / 4-hour timers restart. This is recorded in Manager History.'}</div><div class="dialog-actions"><button data-cancel>${zh?'取消':'Cancel'}</button><button class="confirm" data-confirm-bulk>${zh?'确认全部上架':'CONFIRM · START ALL'}</button></div></div></div>`;modal.querySelector('[data-cancel]').onclick=()=>modal.innerHTML='';modal.querySelector('[data-confirm-bulk]').onclick=()=>{let now=Date.now();state.foods.forEach(f=>{f.start=now;f.status='GOOD';f.kitchen='idle';delete f.stoppedAt;delete f.closedAt});log(`BULK START · ${n} NEW BATCHES`,null,`All items started together at ${time(now)}; all 2/4 hour timers reset`);modal.innerHTML='';render();toast(zh?`✓ ${n}道菜已全部上架`:`✓ All ${n} dishes are now on display`)};}
function confirmStopAll(){let n=state.foods.length,zh=state.lang==='zh',title=zh?'确认今日收档？':'Close for the day?',detail=zh?`这会清空全部 ${n} 道菜品的展示状态，取消所有厨房任务，并停止所有计时与提醒。系统将等待明天开档。`:`This clears all ${n} dishes from the display, clears every kitchen task, and stops all timers and alerts. The system then waits for the next opening.`,warning=zh?'⚠ 请只在晚上收档、所有菜品已下架后执行。此操作会记录在经理后台。':'⚠ Use this only after closing service and removing all food. The end-of-day action is recorded in Manager History.',cancel=zh?'取消':'Cancel',confirm=zh?'确认 · 今日收档':'CONFIRM · CLOSE DAY';modal.innerHTML=`<div class="overlay"><div class="dialog" role="dialog" aria-modal="true"><h2>${title}</h2><p>${detail}</p><div class="warning">${warning}</div><div class="dialog-actions"><button data-cancel>${cancel}</button><button class="confirm" style="background:var(--red);border-color:var(--red)" data-confirm-stop>${confirm}</button></div></div></div>`;modal.querySelector('[data-cancel]').onclick=()=>modal.innerHTML='';modal.querySelector('[data-confirm-stop]').onclick=()=>{let now=Date.now();state.foods.forEach(f=>{f.closedAt=now;f.stoppedAt=now;f.status='CLOSED';f.kitchen='idle'});stopKitchenSiren();closeKitchenAlert();log(`END OF DAY · ${n} DISHES CLEARED`,null,`All dishes cleared, kitchen tasks cancelled, and timers ended at ${time(now)}`);modal.innerHTML='';render();toast(zh?'■ 今日已收档，等待明日开档':'■ Day closed · waiting for next opening')};}
function four(id){let f=state.foods.find(x=>x.id===id);modal.innerHTML=`<div class="overlay"><div class="dialog"><h2>4-Hour Action · ${esc(displayName(f))}</h2><p>The old batch must be closed before a new timer starts.</p><div class="dialog-actions"><button data-action="DISCARDED">Discard + New Batch</button><button class="confirm" data-action="REPLACED">Replace + New Batch</button><button data-cancel style="grid-column:1/-1">Cancel</button></div></div></div>`;translateContainer(modal);modal.querySelector('[data-cancel]').onclick=()=>modal.innerHTML='';modal.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{log(`${b.dataset.action} AT 4-HOUR ACTION`,f,`Previous batch closed after ${duration(mins(f))}`);f.start=Date.now();f.status='GOOD';f.kitchen='idle';log('NEW BATCH STARTED',f,'2/4 hour timer started');modal.innerHTML='';render()})}
function csv(){let rows=[['Date/Time','Action','Food','Section','Details'],...state.logs.map(l=>[new Date(l.at).toLocaleString(),l.action,l.food,l.section,l.detail])];let blob=new Blob([rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BBQ-Town-Food-Safety-Log.csv';a.click();URL.revokeObjectURL(a.href)}
function wire(){document.querySelectorAll('[data-bulk]').forEach(b=>b.onclick=confirmBulk);document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{state.category=b.dataset.cat;render()});document.querySelector('[data-enable-kitchen-sound]')?.addEventListener('click',()=>primeKitchenAudio(true));document.querySelector('[data-manager-login]')?.addEventListener('click',managerLogin);document.querySelector('[data-manager-pin]')?.addEventListener('keydown',e=>{if(e.key==='Enter')managerLogin()});document.querySelector('[data-add-dish]')?.addEventListener('click',addDish);document.querySelector('[data-workflow-settings]')?.addEventListener('click',openWorkflowSettings);document.querySelectorAll('[data-delete-dish]').forEach(b=>b.onclick=()=>deleteDish(+b.dataset.deleteDish));let s=document.querySelector('[data-search]');if(s)s.oninput=e=>{state.query=e.target.value;foh();translatePage()};document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{let f=state.foods.find(x=>x.id==b.dataset.id),old=f.status,wasIdle=f.kitchen==='idle';f.status=b.dataset.status;if(f.status==='LOW'||f.status==='EMPTY'){f.kitchen=wasIdle?'requested':f.kitchen;if(wasIdle){f.requestedAt=Date.now();delete f.readyAt}}else if(old!=='GOOD'&&f.kitchen==='requested'){f.kitchen='idle';delete f.requestedAt;delete f.readyAt}log(`${f.status} STATUS`,f,f.status==='EMPTY'?'Urgent kitchen request':f.status==='LOW'?'Prepare next tray':'Floor confirmed display is good');render();toast(`${displayName(f)} · ${state.lang==='zh'?{'GOOD':'正常','LOW':'不足','EMPTY':'空盘'}[f.status]:f.status}`)});document.querySelectorAll('[data-kitchen]').forEach(b=>b.onclick=()=>{let f=state.foods.find(x=>x.id==b.dataset.kitchen);if(f.kitchen==='requested'){beginPreparing(f.id);return}else if(f.kitchen==='preparing'){f.kitchen='ready';f.readyAt=Date.now();log('READY TO REFILL',f,'Kitchen finished; waiting for FOH confirmation')}render()});document.querySelectorAll('[data-floor-refill]').forEach(b=>b.onclick=()=>{let f=state.foods.find(x=>x.id==b.dataset.floorRefill);log('OLD BATCH REPLACED BY FOH',f,`Closed after ${duration(mins(f))}`);f.kitchen='idle';f.status='GOOD';f.start=Date.now();delete f.requestedAt;delete f.readyAt;log('NEW BATCH STARTED BY FOH',f,'Refilled on floor; 2/4 hour timer started');render();toast(state.lang==='zh'?`✓ ${displayName(f)}已补菜，新计时开始`:`✓ ${f.name} refilled · new timer started`)});document.querySelectorAll('[data-mgr]').forEach(b=>b.onclick=()=>{state.mgrTab=b.dataset.mgr;render()});document.querySelectorAll('[data-section]').forEach(s=>s.onchange=()=>{let f=state.foods.find(x=>x.id==s.dataset.section);f.section=+s.value;log('SECTION CHANGED',f,`Assigned to Section ${f.section}`);render()});document.querySelector('[data-csv]')?.addEventListener('click',csv);document.querySelectorAll('[data-four]').forEach(b=>b.onclick=()=>four(+b.dataset.four))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;render();primeKitchenAudio(false);if(state.view==='manager')checkManagerAuth()});document.querySelector('#langToggle').onclick=()=>{state.lang=state.lang==='en'?'zh':'en';state.query='';render()};function clock(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,1000);tick=setInterval(render,60000);render();loadCloud();checkManagerAuth();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.addEventListener('click',e=>{if(e.target.closest('[data-stop]'))confirmStopAll()});
document.addEventListener('click',e=>{let button=e.target.closest('[data-manager-login]');if(!button)return;e.preventDefault();e.stopImmediatePropagation();if(location.protocol==='file:'){managerAuthorized=true;render();return}let pin=document.querySelector('[data-manager-pin]')?.value||'',form=document.createElement('form');form.method='post';form.action='/staff-login/submit';let add=(name,value)=>{let input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;form.appendChild(input)};add('pin',pin);add('next','/ops.html');document.body.appendChild(form);form.submit()},true);
})();
</script></body></html>
