<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172018"><title>BBQ Town Today</title><style>
:root{--ink:#172018;--muted:#6a746d;--line:#dfe5df;--bg:#f5f4ef;--green:#2e7d49;--amber:#b87400;--red:#be3030}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,input{font:inherit}header{background:#172018;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:5}.bar{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.bar h1{margin:0;font-size:21px}.bar small{color:#b8c6bc}.back{color:#fff;text-decoration:none;border:1px solid #ffffff44;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:800}main{max-width:980px;margin:auto;padding:18px}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}.hero h2{margin:0;font-size:30px}.hero p{margin:5px 0 0;color:var(--muted)}.notice{display:none;border-radius:12px;padding:12px 14px;margin-bottom:11px;font-size:12px;font-weight:850}.notice.warn{display:block;background:#fff1d6;color:#805000;border:1px solid #e7c982}.notice.bad{display:block;background:#ffe9e7;color:#8c2424;border:1px solid #efb0aa}.progress{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}.progress .row{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.track{height:10px;background:#e9ede9;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;background:var(--green);width:0}.section{margin:16px 0 6px;font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.05em}.task{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:9px}.task.done{opacity:.6}.task.overdue{border-color:#e6b46a;background:#fff9ec}.check{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:900}.task.done .check{background:#e8f5ec;color:var(--green);border-color:#b8dbc2}.task h3{margin:0;font-size:15px}.task p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.4}.badge{font-size:10px;font-weight:900;border-radius:99px;padding:6px 8px;background:#eef1ed;color:var(--muted);white-space:nowrap}.badge.due{background:#fff1d6;color:#8a5700}.badge.overdue{background:#fee9e7;color:var(--red)}.completeBy{display:flex;gap:8px;margin-top:14px;align-items:center}.completeBy input{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px}.hint{font-size:11px;color:var(--muted);margin-top:8px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#172018;color:#fff;padding:12px 16px;border-radius:10px;display:none;font-weight:800}@media(max-width:600px){main{padding:14px}.hero{align-items:flex-start;flex-direction:column}.hero h2{font-size:25px}.task{grid-template-columns:48px 1fr}.badge{grid-column:2;justify-self:start}.check{width:44px;height:44px}}
</style></head><body><header><div class="bar"><div><h1>BBQ TOWN</h1><small>Dickson · Today</small></div><a class="back" href="/manager-dashboard.html">MANAGER</a></div></header><main><div class="hero"><div><h2>Today</h2><p>Only the jobs that matter. Tap once when done.</p></div><div id="dateLabel"></div></div><div class="notice" id="notice"></div><div class="progress"><div class="row"><span>TODAY'S PROGRESS</span><span id="progressText">0 / 0</span></div><div class="track"><div class="fill" id="fill"></div></div></div><div class="completeBy"><input id="completedBy" placeholder="Manager / staff name"><button class="back" style="background:#172018;border:0" id="saveName">SAVE NAME</button></div><div class="hint">Your name stays on this tablet so routine checks take one tap.</div><div id="tasks"></div></main><div class="toast" id="toast"></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Sydney'});$('#dateLabel').textContent=new Date().toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});$('#completedBy').value=localStorage.getItem('bbqCompletedBy')||'';$('#saveName').onclick=()=>{localStorage.setItem('bbqCompletedBy',$('#completedBy').value.trim());toast('Name saved')};let tasks=[],automation={overdueTasks:[],closingBlock:[]};function toast(s){let e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1300)}function groupTitle(cat){return cat==='FOOD SAFETY'?'FOOD SAFETY':cat==='CLEANING'?'CLEANING':cat==='MAINTENANCE'?'MAINTENANCE':'STORE MANAGEMENT'}function render(){let due=tasks.filter(x=>x.due||x.completed),done=due.filter(x=>x.completed).length;$('#progressText').textContent=`${done} / ${due.length}`;$('#fill').style.width=(due.length?Math.round(done/due.length*100):100)+'%';let overdue=new Set((automation.overdueTasks||[]).map(x=>x.taskKey)),closing=automation.closingBlock||[],n=$('#notice');if(closing.length){n.className='notice bad';n.textContent=`CLOSING NOT READY · ${closing.length} required check${closing.length===1?'':'s'} still incomplete.`}else if(overdue.size){n.className='notice warn';n.textContent=`${overdue.size} task${overdue.size===1?' is':'s are'} overdue. Complete these first.`}else{n.className='notice';n.textContent=''}let cats=[...new Set(due.map(x=>groupTitle(x.category)))];$('#tasks').innerHTML=cats.map(cat=>`<div class="section">${cat}</div>`+due.filter(x=>groupTitle(x.category)===cat).map(x=>{let ov=overdue.has(x.task_key)&&!x.completed;return `<div class="task ${x.completed?'done':''} ${ov?'overdue':''}"><button class="check" data-key="${esc(x.task_key)}">${x.completed?'✓':'○'}</button><div><h3>${esc(x.title)}</h3><p>${esc(x.description)}${x.completed_by?` · Done by ${esc(x.completed_by)}`:''}</p></div><span class="badge ${ov?'overdue':x.due&&!x.completed?'due':''}">${x.completed?'DONE':ov?'OVERDUE':x.frequency}</span></div>`}).join('')).join('');document.querySelectorAll('.check').forEach(b=>b.onclick=()=>toggle(b.dataset.key))}async function toggle(key){let t=tasks.find(x=>x.task_key===key),by=$('#completedBy').value.trim();if(!t)return;if(!t.completed&&!by){toast('Enter your name first');$('#completedBy').focus();return}if(!t.completed)localStorage.setItem('bbqCompletedBy',by);let r=await fetch('/api/ops/routines',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({taskKey:key,date,completed:!t.completed,completedBy:by})});if(r.ok){toast(t.completed?'Reopened':'Done');load()}else toast('Could not save')}async function load(){try{let [r,a]=await Promise.all([fetch('/api/ops/routines?date='+date,{cache:'no-store'}),fetch('/api/ops/automation',{cache:'no-store'})]);let [d,ad]=await Promise.all([r.json(),a.json()]);tasks=d.tasks||[];automation=ad||{};render()}catch{toast('Unable to load tasks')}}load();setInterval(load,30000)})();
</script></body></html>
