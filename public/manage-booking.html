<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Manage reservation · BBQTOWN Dickson</title>
<style>
:root{--ink:#20130e;--muted:#806e61;--red:#b23728;--cream:#f8f2e9;--paper:#fff;--line:#e9ddd0;--green:#1f7255}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#160d0a 0,#2d1710 38%,#f8f2e9 38%);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);padding:28px 18px}.top{width:min(680px,100%);margin:0 auto 18px;color:#fff;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;letter-spacing:.04em}.lang{border:1px solid #ffffff66;border-radius:999px;background:#ffffff13;color:#fff;padding:8px 13px;font-weight:800}.card{width:min(680px,100%);margin:auto;background:var(--paper);border-radius:24px;padding:34px;box-shadow:0 24px 70px #180b0630}.kicker{color:var(--red);font-size:12px;letter-spacing:.14em;font-weight:900}.card h1{font-size:clamp(32px,7vw,48px);line-height:1;margin:12px 0}.muted{color:var(--muted);line-height:1.55}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.detail{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:16px}.detail small{display:block;color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.08em;margin-bottom:6px}.detail b{font-size:18px}.status{display:inline-flex;border-radius:999px;padding:7px 11px;background:#e6f3eb;color:var(--green);font-size:12px;font-weight:900;text-transform:uppercase}.status.cancelled{background:#f8e6e4;color:var(--red)}.edit{border-top:1px solid var(--line);padding-top:24px;margin-top:25px}.field{margin:14px 0}label{display:block;font-size:13px;font-weight:900;margin-bottom:8px}select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:900;cursor:pointer;background:var(--red);color:#fff}.btn:disabled{opacity:.5}.cancel{margin-top:12px;background:#fff;color:var(--red);border:1.5px solid #e9bbb6}.msg{border-radius:12px;padding:13px;margin:17px 0 0;background:#eef6f1;color:var(--green);font-weight:750;line-height:1.45}.msg.error{background:#fae9e7;color:#921f17}.loading{text-align:center;padding:60px 10px;color:var(--muted);font-weight:800}.hidden{display:none!important}@media(max-width:560px){body{padding:18px 12px}.card{padding:25px 19px;border-radius:19px}.details{grid-template-columns:1fr}.top{padding:0 4px}}
</style></head><body>
<header class="top"><div class="brand">BBQTOWN DICKSON</div><button class="lang" id="lang">中文</button></header>
<main class="card" id="app"><div class="loading" data-en="Loading your reservation…" data-zh="正在加载您的预订…">Loading your reservation…</div></main>
<script>
const $=id=>document.getElementById(id);let lang=localStorage.getItem('booking-lang')||'en',booking=null,maxParty=1;const params=new URLSearchParams(location.hash.slice(1)),token=params.get('token')||sessionStorage.getItem('booking-manage-token')||'';if(token){sessionStorage.setItem('booking-manage-token',token);history.replaceState({},'',location.pathname)}
const copy={en:{title:'Manage reservation',reference:'Reference',date:'Date',time:'Time',party:'Party size',guest:'Guest',people:'guests',change:'Change party size',save:'Save changes',saving:'Saving…',cancel:'Cancel reservation',confirmCancel:'Cancel this reservation? This action cannot be undone.',cancelling:'Cancelling…',saved:'Your party size has been updated.',cancelled:'Your reservation has been cancelled.',emailOk:' A confirmation email has been sent.',emailFail:' Please save this page because the confirmation email could not be sent.',invalid:'This private booking link is invalid or has expired.',notEditable:'This reservation can no longer be changed online.',back:'Make a new reservation'},zh:{title:'管理预订',reference:'预订编号',date:'日期',time:'时间',party:'人数',guest:'客人',people:'位',change:'修改人数',save:'保存修改',saving:'正在保存…',cancel:'取消预订',confirmCancel:'确定取消这个预订吗？取消后无法恢复。',cancelling:'正在取消…',saved:'预订人数已修改。',cancelled:'您的预订已取消。',emailOk:' 确认邮件已发送。',emailFail:' 确认邮件未能发送，请保存本页面。',invalid:'此预订管理链接无效或已失效。',notEditable:'此预订已经不能在线修改。',back:'重新预订'}};function t(k){return copy[lang][k]}
function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}function applyLang(){document.documentElement.lang=lang==='zh'?'zh-CN':'en-AU';$('lang').textContent=lang==='en'?'中文':'English';localStorage.setItem('booking-lang',lang);if(booking)render()}
$('lang').onclick=()=>{lang=lang==='en'?'zh':'en';applyLang()};applyLang();
async function api(method='GET',body){const r=await fetch('/api/bookings/manage',{method,cache:'no-store',headers:{'Authorization':'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw new Error(d.error||t('invalid'));return d}
function render(message='',isError=false){const editable=booking.status==='confirmed';$('app').innerHTML=`<div class="kicker">BBQTOWN DICKSON</div><h1>${t('title')}</h1><span class="status ${booking.status==='cancelled'?'cancelled':''}">${esc(booking.status)}</span><div class="details"><div class="detail"><small>${t('reference')}</small><b>${esc(booking.reference)}</b></div><div class="detail"><small>${t('guest')}</small><b>${esc(booking.guestName)}</b></div><div class="detail"><small>${t('date')}</small><b>${esc(booking.date)}</b></div><div class="detail"><small>${t('time')}</small><b>${esc(booking.time)}</b></div><div class="detail"><small>${t('party')}</small><b>${booking.partySize} ${t('people')}</b></div></div>${message?`<div class="msg ${isError?'error':''}">${esc(message)}</div>`:''}${editable?`<section class="edit"><h2>${t('change')}</h2><div class="field"><label>${t('party')}</label><select id="party">${Array.from({length:maxParty},(_,i)=>`<option value="${i+1}" ${i+1===booking.partySize?'selected':''}>${i+1} ${t('people')}</option>`).join('')}</select></div><button class="btn" id="save">${t('save')}</button><button class="btn cancel" id="cancel">${t('cancel')}</button></section>`:`<p class="muted">${t('notEditable')}</p>`}<p style="margin:25px 0 0;text-align:center"><a href="/book.html" style="color:#8f2d24;font-weight:850">${t('back')}</a></p>`;if(editable){$('save').onclick=save;$('cancel').onclick=cancelBooking}}
async function load(){if(!token){$('app').innerHTML=`<div class="loading">${t('invalid')}</div>`;return}try{const d=await api();booking=d.booking;maxParty=d.maxPartySize;render()}catch(e){$('app').innerHTML=`<div class="loading">${esc(e.message||t('invalid'))}</div>`}}
async function save(){const btn=$('save');btn.disabled=true;btn.textContent=t('saving');try{const d=await api('PATCH',{partySize:Number($('party').value)});booking=d.booking;render(t('saved')+(d.emailSent?t('emailOk'):t('emailFail')))}catch(e){render(e.message||t('invalid'),true)}}
async function cancelBooking(){if(!confirm(t('confirmCancel')))return;const btn=$('cancel');btn.disabled=true;btn.textContent=t('cancelling');try{const d=await api('DELETE');booking=d.booking;render(t('cancelled')+(d.emailSent?t('emailOk'):t('emailFail')))}catch(e){render(e.message||t('invalid'),true)}}load();
</script></body></html>
