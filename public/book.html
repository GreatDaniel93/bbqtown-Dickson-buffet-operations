<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Book a Table · BBQ Town Dickson</title><meta name="theme-color" content="#18130f">
<style>
:root{--ink:#201812;--muted:#76685e;--red:#a52a24;--cream:#f6f0e8;--line:#ded2c5;--green:#176c4d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#201813,#3d2019);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh}.shell{max-width:1100px;margin:auto;padding:32px 18px 64px}.brand{color:white;text-align:center;margin:12px 0 26px}.brand b{display:block;font-size:clamp(30px,5vw,52px);letter-spacing:-1.5px}.brand span{color:#e8c995}.card{background:var(--cream);border-radius:28px;box-shadow:0 24px 70px #0007;overflow:hidden}.grid{display:grid;grid-template-columns:.85fr 1.15fr}.intro{padding:44px;background:#efe3d4}.intro h1{font-size:40px;line-height:1.05;margin:0 0 18px}.intro p{color:var(--muted);line-height:1.6}.steps{margin-top:34px;display:grid;gap:18px}.step{display:flex;gap:13px;align-items:center}.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--red);font-weight:900}.form{padding:44px}label{font-size:13px;font-weight:800;display:block;margin:0 0 8px}input,select,textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:13px;background:#fff;padding:14px;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px #a52a2418}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin-bottom:17px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.slot{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-weight:800;cursor:pointer}.slot:hover{border-color:var(--red)}.slot.selected{background:var(--red);border-color:var(--red);color:#fff}.slot:disabled{opacity:.35;cursor:not-allowed}.notice{padding:14px;border-radius:12px;background:#fff5db;color:#735214;line-height:1.45;margin-bottom:16px}.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);line-height:1.45}.check input{width:18px;margin-top:2px}.submit{width:100%;margin-top:20px;border:0;border-radius:14px;padding:16px;background:var(--red);color:white;font-size:17px;font-weight:900;cursor:pointer}.submit:disabled{opacity:.55}.error{color:#9a1d1d;font-weight:700;min-height:22px}.success{text-align:center;padding:55px 25px}.success .tick{width:70px;height:70px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:38px;margin:auto}.ref{font-size:28px;font-weight:900;letter-spacing:2px;color:var(--red);padding:14px}.lang{position:absolute;right:18px;top:18px;border:1px solid #ffffff55;color:#fff;background:#ffffff15;border-radius:999px;padding:9px 14px;cursor:pointer}@media(max-width:760px){.grid{grid-template-columns:1fr}.intro{padding:28px}.intro h1{font-size:32px}.steps{display:none}.form{padding:28px 22px}.row{grid-template-columns:1fr}.slots{grid-template-columns:repeat(2,1fr)}.shell{padding:18px 10px 40px}}
</style></head><body><button class="lang" id="lang">中文</button><main class="shell"><div class="brand"><b>BBQ TOWN</b><span>DICKSON · TABLE RESERVATIONS</span></div><section class="card" id="app"><div class="grid"><aside class="intro"><h1 data-en="Your table is waiting." data-zh="为您预留餐桌。">Your table is waiting.</h1><p data-en="Choose your date, time and party size. We’ll confirm your reservation instantly." data-zh="选择日期、时间和人数，我们会立即确认您的预定。">Choose your date, time and party size. We’ll confirm your reservation instantly.</p><div class="steps"><div class="step"><span class="num">1</span><b data-en="Choose a date and time" data-zh="选择日期与时间">Choose a date and time</b></div><div class="step"><span class="num">2</span><b data-en="Enter your details" data-zh="填写联系资料">Enter your details</b></div><div class="step"><span class="num">3</span><b data-en="Receive your booking reference" data-zh="获得预定编号">Receive your booking reference</b></div></div></aside><form class="form" id="form"><div class="row"><div class="field"><label data-en="Date" data-zh="日期">Date</label><input id="date" type="date" required></div><div class="field"><label data-en="Party size" data-zh="人数">Party size</label><select id="party" required><option value="" data-en="Select" data-zh="请选择">Select</option></select></div></div><div class="field"><label data-en="Available times" data-zh="可选时间">Available times</label><div id="slots" class="slots"><div class="notice" style="grid-column:1/-1" data-en="Choose a date first." data-zh="请先选择日期。">Choose a date first.</div></div></div><input id="time" type="hidden"><div class="field"><label data-en="Name" data-zh="姓名">Name</label><input id="name" maxlength="100" autocomplete="name" required></div><div class="row"><div class="field"><label data-en="Mobile number" data-zh="手机号码">Mobile number</label><input id="phone" type="tel" maxlength="30" autocomplete="tel" required></div><div class="field"><label data-en="Email (optional)" data-zh="邮箱（选填）">Email (optional)</label><input id="email" type="email" maxlength="160" autocomplete="email"></div></div><div class="field"><label data-en="Special requests or dietary needs (optional)" data-zh="特别要求或饮食需求（选填）">Special requests or dietary needs (optional)</label><textarea id="notes" rows="3" maxlength="600"></textarea></div><label class="check"><input id="agree" type="checkbox" required><span data-en="I confirm that the details above are correct. Special requests are noted but cannot be guaranteed." data-zh="我确认以上资料正确。餐厅会记录特别要求，但不能保证全部满足。">I confirm that the details above are correct. Special requests are noted but cannot be guaranteed.</span></label><p class="error" id="error"></p><button class="submit" id="submit" type="submit" data-en="Confirm reservation" data-zh="确认预定">Confirm reservation</button></form></div></section></main>
<script>
const S={lang:localStorage.getItem('booking-lang')||'en',maxParty:0};const $=id=>document.getElementById(id);function tr(en,zh){return S.lang==='zh'?zh:en}function applyLang(){document.documentElement.lang=S.lang;document.querySelectorAll('[data-en]').forEach(x=>x.textContent=x.dataset[S.lang]);$('lang').textContent=S.lang==='en'?'中文':'English';localStorage.setItem('booking-lang',S.lang)}$('lang').onclick=()=>{S.lang=S.lang==='en'?'zh':'en';applyLang();if($('date').value)loadSlots()};applyLang();
const now=new Date();const local=new Date(now.toLocaleString('en-US',{timeZone:'Australia/Sydney'}));$('date').min=[local.getFullYear(),String(local.getMonth()+1).padStart(2,'0'),String(local.getDate()).padStart(2,'0')].join('-');
function parties(max){S.maxParty=max;$('party').innerHTML='<option value="">'+tr('Select','请选择')+'</option>'+Array.from({length:max},(_,i)=>`<option value="${i+1}">${i+1} ${tr(i?'people':'person','位')}</option>`).join('')}
async function loadSlots(){$('time').value='';$('error').textContent='';$('slots').innerHTML='<div class="notice" style="grid-column:1/-1">'+tr('Checking availability…','正在查询空位…')+'</div>';try{const r=await fetch('/api/bookings/availability?date='+encodeURIComponent($('date').value),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error);if(!d.enabled){$('slots').innerHTML='<div class="notice" style="grid-column:1/-1">'+tr('Online reservations are not open yet. Please contact the restaurant.','网上预定尚未开放，请联系餐厅。')+'</div>';return}if(S.maxParty!==d.maxPartySize)parties(d.maxPartySize);if(!d.slots.length){$('slots').innerHTML='<div class="notice" style="grid-column:1/-1">'+tr('No online booking times are available on this date.','这一天暂无可网上预定的时间。')+'</div>';return}$('slots').innerHTML=d.slots.map(s=>`<button type="button" class="slot" data-time="${s.time}" ${s.remaining<1?'disabled':''}>${s.time}${s.remaining<1?' · '+tr('Full','已满'):''}</button>`).join('');document.querySelectorAll('.slot:not(:disabled)').forEach(b=>b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('time').value=b.dataset.time})}catch(e){$('slots').innerHTML='<div class="notice" style="grid-column:1/-1">'+tr('Availability could not be loaded. Please try again.','暂时无法查询空位，请重试。')+'</div>'}}$('date').onchange=loadSlots;
$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';if(!$('time').value){$('error').textContent=tr('Please choose a time.','请选择时间。');return}const btn=$('submit');btn.disabled=true;btn.textContent=tr('Confirming…','正在确认…');try{const r=await fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:$('date').value,time:$('time').value,partySize:Number($('party').value),name:$('name').value,phone:$('phone').value,email:$('email').value,notes:$('notes').value})});const d=await r.json();if(!r.ok)throw new Error(d.error);$('app').innerHTML=`<div class="success"><div class="tick">✓</div><h1>${tr('Reservation confirmed','预定成功')}</h1><p>${tr('Please save your booking reference:','请保存您的预定编号：')}</p><div class="ref">${d.reference}</div><p>${d.date} · ${d.time} · ${d.partySize} ${tr('guests','位')}</p><p>${tr('We look forward to welcoming you.','期待您的光临。')}</p></div>`}catch(err){$('error').textContent=err.message||tr('Could not make the reservation.','无法完成预定。');btn.disabled=false;btn.textContent=tr('Confirm reservation','确认预定');loadSlots()}};
</script></body></html>
