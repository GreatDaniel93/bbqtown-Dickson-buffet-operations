<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172018"><title>BBQ Town Manager Dashboard</title>
<style>
:root{--ink:#172018;--muted:#69736c;--line:#dfe5df;--bg:#f5f4ef;--green:#2e7d49;--amber:#b87400;--red:#be3030}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}header{background:#172018;color:#fff;padding:18px 20px;position:sticky;top:0;z-index:10}.bar{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{margin:0;font-size:21px}.brand small{color:#b8c6bc}.back{color:#fff;text-decoration:none;border:1px solid #ffffff44;border-radius:9px;padding:10px 13px;font-weight:800;font-size:12px}main{max-width:1200px;margin:auto;padding:22px}.hero h2{margin:0;font-size:30px;letter-spacing:-.04em}.hero p{margin:6px 0 18px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat b{display:block;font-size:28px}.stat span{color:var(--muted);font-size:11px;font-weight:800}.section{background:#fff;border:1px solid var(--line);border-radius:13px;margin-top:14px;overflow:hidden}.section h3{margin:0;padding:15px 16px;border-bottom:1px solid var(--line);font-size:15px}.devices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px}.device{border:1px solid var(--line);border-radius:10px;padding:13px}.device.off{border-color:#efb0b0;background:#fff3f3}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{font-size:10px;font-weight:900;padding:5px 8px;border-radius:99px;background:#e8f5ec;color:var(--green)}.off .pill{background:#ffe3e3;color:var(--red)}.device small,.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:12px}th{font-size:10px;text-transform:uppercase;color:var(--muted);background:#f7f8f6}.empty{padding:24px;text-align:center;color:var(--muted)}.sync{text-align:right;color:var(--muted);font-size:11px;margin-top:10px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.devices{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{padding:14px}.devices{grid-template-columns:1fr}.hero h2{font-size:25px}}
</style></head><body><header><div class="bar"><div class="brand"><h1>BBQ TOWN</h1><small>Dickson · Manager Dashboard</small></div><a class="back" href="/ops.html?full=1">OPERATIONS</a></div></header>
<main><section class="hero"><h2>Live operations</h2><p>Device health, kitchen workload and a searchable operating trail for the store.</p></section><div class="stats" id="stats"></div><section class="section"><h3>Device health</h3><div class="devices" id="devices"></div></section><section class="section"><h3>Last 24 hours</h3><div id="counts"></div></section><section class="section"><h3>Recent activity</h3><div id="events"></div></section><div class="sync" id="sync">Connecting…</div></main>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function age(ms){let s=Math.max(0,Math.floor((Date.now()-ms)/1000));if(s<60)return s+'s ago';let m=Math.floor(s/60);if(m<60)return m+'m ago';return Math.floor(m/60)+'h ago'}
async function load(){try{let [sum,dev]=await Promise.all([fetch('/api/ops/summary',{cache:'no-store'}),fetch('/api/ops/devices',{cache:'no-store'})]);if(!sum.ok||!dev.ok)throw Error('auth');let s=await sum.json(),d=await dev.json(),ds=s.devices||{};$('#stats').innerHTML=`<div class="stat"><b>${ds.online_devices||0}/${ds.total_devices||0}</b><span>DEVICES ONLINE</span></div><div class="stat"><b>${ds.pending_tasks||0}</b><span>PENDING KITCHEN TASKS</span></div><div class="stat"><b>${(s.eventCounts24h||[]).reduce((a,x)=>a+Number(x.count||0),0)}</b><span>OPERATIONS EVENTS · 24H</span></div><div class="stat"><b>${(d.devices||[]).filter(x=>!x.healthy).length}</b><span>DEVICES NEED ATTENTION</span></div>`;
$('#devices').innerHTML=(d.devices||[]).length?(d.devices||[]).map(x=>`<div class="device ${x.healthy?'':'off'}"><div class="row"><strong>${esc(x.role||'unknown').toUpperCase()}</strong><span class="pill">${x.healthy?'ONLINE':'OFFLINE'}</span></div><div style="margin-top:8px;font-size:12px">${esc(x.device_id)}</div><small>${esc(x.app_version||'')} · ${age(Number(x.last_seen))} · Pending ${Number(x.pending_tasks||0)}</small></div>`).join(''):'<div class="empty">No app devices have reported yet.</div>';
let counts=s.eventCounts24h||[];$('#counts').innerHTML=counts.length?`<table><thead><tr><th>Event</th><th>Count</th></tr></thead><tbody>${counts.map(x=>`<tr><td>${esc(x.event_type)}</td><td><strong>${Number(x.count||0)}</strong></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No events recorded yet.</div>';
let ev=s.recent||[];$('#events').innerHTML=ev.length?`<table><thead><tr><th>Time</th><th>Role</th><th>Event</th><th>Detail</th></tr></thead><tbody>${ev.map(x=>`<tr><td>${age(Number(x.created_at))}</td><td>${esc(x.role)}</td><td><strong>${esc(x.event_type)}</strong></td><td>${esc(x.label)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Activity will appear here as devices report.</div>';$('#sync').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch(e){$('#sync').textContent='Unable to load dashboard · check staff sign-in'}}
load();setInterval(load,10000)})();
</script></body></html>
