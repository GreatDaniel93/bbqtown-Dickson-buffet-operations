<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#071a29"><title>Hanok Ops</title>
<style>
:root{--navy:#071a29;--navy2:#0b2437;--ivory:#f7f4ee;--paper:#fffdf9;--gold:#b79254;--gold2:#d8bd86;--text:#10202f;--muted:#75808a;--red:#df4d5b;--blue:#4e88cf;--green:#3f9a70;--amber:#d2943d;--line:#e7e0d6}
*{box-sizing:border-box}html,body{margin:0;background:var(--navy);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);height:100%;overflow:hidden}button,input,textarea,select{font:inherit}
#app{height:100%;background:linear-gradient(180deg,#071a29 0,#0b2437 36%,#f6f2ea 36%,#f6f2ea 100%);overflow:hidden}.screen{height:100%;display:flex;flex-direction:column}.top{padding:calc(22px + env(safe-area-inset-top)) 20px 18px;color:white;position:relative}.brand{font-family:Georgia,serif;font-size:30px;font-weight:700;letter-spacing:-.6px}.greet{font-size:21px;font-weight:700;margin-top:18px}.sub{color:#afbac3;font-size:12px;margin-top:4px}.bell{position:absolute;right:20px;top:calc(28px + env(safe-area-inset-top));width:36px;height:36px;border:1px solid #ffffff1f;border-radius:18px;display:grid;place-items:center;background:#ffffff09}.dot{position:absolute;right:2px;top:2px;width:8px;height:8px;background:var(--gold2);border-radius:50%}
.content{flex:1;overflow:auto;padding:0 14px calc(86px + env(safe-area-inset-bottom));scrollbar-width:none}.content::-webkit-scrollbar{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:2px}.stat{background:linear-gradient(180deg,#ffffff12,#ffffff08);border:1px solid #ffffff17;color:white;border-radius:16px;padding:14px 8px;text-align:center;backdrop-filter:blur(12px);box-shadow:0 8px 28px #0002}.stat .n{font-size:25px;font-weight:800;margin-top:6px}.stat small{font-size:11px}.stat.red .n,.stat.red small{color:#ff7181}.stat.blue .n,.stat.blue small{color:#7cb5ff}.stat.gold .n,.stat.gold small{color:#e9c46f}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px;font-weight:800;font-size:17px}.sectionTitle span:last-child{font-size:12px;color:var(--muted);font-weight:600}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:0 7px 22px #2331410b;margin-bottom:10px}.ticket{padding:13px 14px;position:relative}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.pill{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800}.pill.red{background:#ffe8eb;color:#c83445}.pill.blue{background:#e9f2ff;color:#306fb9}.pill.gold{background:#f8eddb;color:#9d6a1f}.pill.green{background:#e7f6ed;color:#288059}.store{font-size:11px;color:#54616d;font-weight:700}.age{font-size:11px;color:#7c8790}.ticket h3{margin:9px 0 4px;font-size:15px}.ticket p{margin:0;color:#68737e;font-size:12px;line-height:1.35;padding-right:18px}.chev{position:absolute;right:14px;bottom:17px;color:#9aa3ab}.nav{position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#071a29ef;border-top:1px solid #ffffff14;display:grid;grid-template-columns:repeat(5,1fr);backdrop-filter:blur(18px)}.nav button{border:0;background:none;color:#8292a0;font-size:10px;display:grid;place-items:center;align-content:center;gap:4px}.nav button b{font-size:19px;font-weight:400}.nav button.active{color:#e0bd78}.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:27px;border:0;background:linear-gradient(135deg,#d7b474,#9b7139);color:white;font-size:28px;box-shadow:0 12px 30px #6a4a264d}
.pageHead{background:var(--navy);color:white;padding:calc(24px + env(safe-area-inset-top)) 18px 18px;display:flex;align-items:center;justify-content:space-between}.pageHead h1{font-family:Georgia,serif;margin:0;font-size:27px}.pageHead button{background:none;border:0;color:white;font-size:20px}.tabs{display:flex;background:#0e2a40;padding:5px;border-radius:13px;margin:10px 14px 4px}.tabs button{flex:1;border:0;background:none;color:#9eacb7;padding:9px 6px;border-radius:10px;font-size:12px}.tabs button.active{background:#f8f4ed;color:#132434;font-weight:800}.storeCard{padding:12px 13px}.storeCard h3{margin:0;font-size:14px}.address{font-size:10px;color:#8a949d;margin-top:3px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.kpi{border-radius:10px;padding:7px 3px;text-align:center;font-size:9px}.kpi b{display:block;font-size:14px}.kpi.open{background:#eaf3ff;color:#2868ae}.kpi.urgent{background:#ffe9ec;color:#bd3341}.kpi.wait{background:#fbf0df;color:#976321}.kpi.done{background:#e9f6ed;color:#287c54}.heroKpi{margin:12px 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#ffffff10;border:1px solid #ffffff12;border-radius:16px;overflow:hidden;color:white}.heroKpi div{text-align:center;padding:13px 4px;background:#0d2a40}.heroKpi b{font-size:19px;display:block}.heroKpi small{color:#9fb0bd;font-size:9px}.filter{display:flex;gap:8px;overflow:auto;padding:10px 14px 4px}.filter button{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 12px;font-size:11px;color:#65717b;white-space:nowrap}.filter button.active{background:var(--navy);color:white;border-color:var(--navy)}
.overlay{position:fixed;z-index:100;inset:0;background:#071a29;display:none;overflow:auto}.overlay.show{display:block}.detailTop{padding:calc(22px + env(safe-area-inset-top)) 16px 13px;color:white;display:flex;align-items:center;justify-content:space-between}.detailTop button{background:none;border:0;color:white;font-size:24px}.sheet{background:#f7f3ec;min-height:calc(100% - 62px);border-radius:24px 24px 0 0;padding:16px 14px calc(90px + env(safe-area-inset-bottom))}.detailCard{background:white;border-radius:18px;padding:16px;border:1px solid var(--line)}.detailCard h2{font-family:Georgia,serif;font-size:25px;margin:8px 0 6px}.photo{height:158px;border-radius:14px;margin:14px 0;background:linear-gradient(140deg,#65645f,#23282b 55%,#a5a19a);position:relative;overflow:hidden}.photo:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff18 0 2px,transparent 2px 24px),linear-gradient(180deg,transparent 60%,#ffffff18)}.desc{font-size:13px;color:#5f6b75;line-height:1.5}.meta{background:#f4f2ee;border-radius:13px;padding:11px 12px;margin:14px 0;display:grid;gap:9px;font-size:12px}.timeline{margin-top:16px}.tl{display:grid;grid-template-columns:14px 1fr auto;gap:8px;margin:12px 0;font-size:11px}.tl i{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:4px}.tl strong{display:block;font-size:12px}.tl span{color:#8a939b}.actions{position:fixed;z-index:110;left:0;right:0;bottom:0;background:#fffdf9f4;display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);backdrop-filter:blur(14px)}.actions button{border-radius:11px;padding:13px 5px;border:1px solid #d9d4cc;background:white;font-weight:800;font-size:12px}.actions .complete{background:linear-gradient(135deg,#c9a363,#8d6734);border:0;color:white}
.form label{display:block;font-size:12px;font-weight:800;margin:14px 0 7px}.form input,.form textarea,.form select{width:100%;border:1px solid #ddd6cb;background:white;border-radius:12px;padding:13px;color:#182634;outline:none}.form textarea{min-height:90px;resize:none}.primary{width:100%;border:0;border-radius:13px;background:linear-gradient(135deg,#c9a363,#8d6734);color:white;font-weight:800;padding:15px;margin-top:18px}.radio{display:flex;gap:10px;align-items:center;padding:10px 0;font-size:13px}.radio input{accent-color:#a77b3d}.empty{text-align:center;padding:60px 20px;color:#8b959d}.toast{position:fixed;z-index:200;left:50%;bottom:100px;transform:translateX(-50%);background:#0c2437;color:white;padding:11px 16px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1}
</style></head><body><div id="app"></div><div id="detail" class="overlay"></div><div id="toast" class="toast"></div>
<script>
const stores=["Hanok Woden","Hanok Wagga","Pandan Leaf","Meathouse","BBQTOWN Dickson"];
const seed=[
{id:1,status:"Urgent",store:"BBQTOWN Dickson",title:"Ice machine leaking",desc:"Water is leaking from the ice machine in the kitchen. Needs immediate attention.",age:"2h ago",priority:"red"},
{id:2,status:"Open",store:"Hanok Woden",title:"Exhaust fan issue",desc:"Exhaust fan making unusual noise.",age:"4h ago",priority:"gold"},
{id:3,status:"Overdue",store:"Meathouse",title:"Menu update",desc:"Update winter menu items and pricing.",age:"1d ago",priority:"red"},
{id:4,status:"Open",store:"Hanok Wagga",title:"Supplier follow-up",desc:"Follow up on meat delivery schedule.",age:"6h ago",priority:"blue"},
{id:5,status:"Open",store:"Pandan Leaf",title:"Fridge maintenance",desc:"Routine maintenance for walk-in fridge.",age:"8h ago",priority:"blue"}];
let tickets=JSON.parse(localStorage.getItem("hanokops_tickets")||"null")||seed;let page="home";
const app=document.getElementById("app"),detail=document.getElementById("detail");
function save(){localStorage.setItem("hanokops_tickets",JSON.stringify(tickets))}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1400)}
function nav(){return '<nav class="nav">'+[["⌂","Home","home"],["▤","Tickets","tickets"],["▦","Stores","stores"],["♢","Alerts","alerts"],["◉","Profile","profile"]].map(x=>'<button class="'+(page===x[2]?"active":"")+'" onclick="go(\''+x[2]+'\')"><b>'+x[0]+'</b>'+x[1]+'</button>').join("")+'</nav>'}
function tcard(t){return '<div class="card ticket" onclick="openTicket('+t.id+')"><div class="row between"><div class="row"><span class="pill '+t.priority+'">'+t.status+'</span><span class="store">'+t.store+'</span></div><span class="age">'+t.age+'</span></div><h3>'+t.title+'</h3><p>'+t.desc+'</p><span class="chev">›</span></div>'}
function home(){const urgent=tickets.filter(t=>t.status==="Urgent").length,open=tickets.filter(t=>t.status!=="Completed").length,over=tickets.filter(t=>t.status==="Overdue").length;return '<div class="screen"><div class="top"><div class="brand">Hanok Ops</div><div class="bell">♢<i class="dot"></i></div><div class="greet">Good morning, Daniel</div><div class="sub">Here’s what’s happening across your stores.</div><div class="stats"><div class="stat red"><div>!</div><div class="n">'+urgent+'</div><small>Urgent</small></div><div class="stat blue"><div>▤</div><div class="n">'+open+'</div><small>Open</small></div><div class="stat gold"><div>◷</div><div class="n">'+over+'</div><small>Overdue</small></div></div></div><main class="content"><div class="sectionTitle"><span>Needs Your Attention</span><span onclick="go(\'tickets\')">See all →</span></div>'+tickets.filter(t=>t.status!=="Completed").map(tcard).join("")+'</main><button class="fab" onclick="newTicket()">+</button>'+nav()+'</div>'}
function ticketsPage(){return '<div class="screen"><div class="pageHead"><h1>Tickets</h1><button onclick="newTicket()">＋</button></div><div class="filter"><button class="active">Active</button><button>Urgent</button><button>Waiting</button><button>Completed</button></div><main class="content" style="padding-top:8px">'+tickets.map(tcard).join("")+'</main>'+nav()+'</div>'}
function storesPage(){const counts=[[4,1,2,18],[3,1,1,14],[4,0,2,11],[5,1,3,20],[6,1,2,33]];return '<div class="screen"><div class="pageHead"><h1>Stores</h1><button>⌕</button></div><div class="tabs"><button class="active">Overview</button><button>Map</button><button>Performance</button></div><div class="heroKpi"><div><b>5</b><small>Stores</small></div><div><b>22</b><small>Open Tickets</small></div><div><b>96%</b><small>Resolution Rate</small></div></div><main class="content">'+stores.map((s,i)=>'<div class="card storeCard"><div class="row between"><div><h3>'+s+'</h3><div class="address">Restaurant operations · Australia</div></div><span class="pill green">Open</span></div><div class="kpis"><div class="kpi open"><b>'+counts[i][0]+'</b>Open</div><div class="kpi urgent"><b>'+counts[i][1]+'</b>Urgent</div><div class="kpi wait"><b>'+counts[i][2]+'</b>Waiting</div><div class="kpi done"><b>'+counts[i][3]+'</b>Completed</div></div></div>').join("")+'</main>'+nav()+'</div>'}
function simple(title,body){return '<div class="screen"><div class="pageHead"><h1>'+title+'</h1><button>⋮</button></div><main class="content" style="padding-top:16px">'+body+'</main>'+nav()+'</div>'}
function render(){if(page==="home")app.innerHTML=home();else if(page==="tickets")app.innerHTML=ticketsPage();else if(page==="stores")app.innerHTML=storesPage();else if(page==="alerts")app.innerHTML=simple("Alerts",'<div class="card ticket"><h3>Follow-up reminder</h3><p>Ice machine repair · BBQTOWN Dickson · Today 10:00 AM</p></div><div class="card ticket"><h3>Overdue ticket</h3><p>Menu update · Meathouse · 1 day overdue</p></div>');else app.innerHTML=simple("Profile",'<div class="card ticket"><h3>Daniel</h3><p>HQ Admin · Hanok Group</p></div><div class="card ticket"><h3>Hanok Ops</h3><p>Local prototype · Data is stored on this device.</p></div>')}
function go(p){page=p;render()}
function openTicket(id){const t=tickets.find(x=>x.id===id);detail.className="overlay show";detail.innerHTML='<div class="detailTop"><button onclick="closeDetail()">‹</button><b>Ticket Detail</b><button>⋮</button></div><div class="sheet"><div class="detailCard"><div class="row between"><span class="pill '+t.priority+'">'+t.status+'</span><span class="pill blue">In Progress</span></div><h2>'+t.title+'</h2><div class="store">▦ '+t.store+'</div><div class="photo"></div><b>Description</b><p class="desc">'+t.desc+' Please arrange a technician or responsible person to inspect and resolve it.</p><div class="meta"><div>♙ &nbsp; <b>Assignee</b><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Daniel</div><div>▣ &nbsp; <b>Due Date</b><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Today, 6:00 PM</div><div>◷ &nbsp; <b>Created</b><br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; Today, 9:15 AM</div></div><div class="timeline"><b>Timeline</b><div class="tl"><i></i><div><strong>Store created ticket</strong><span>Reported by store manager</span></div><span>9:15 AM</span></div><div class="tl"><i></i><div><strong>Daniel accepted</strong><span>Ticket assigned to Daniel</span></div><span>9:28 AM</span></div></div></div></div><div class="actions"><button onclick="setStatus('+id+',\'Open\')">✓ Accept</button><button onclick="waiting('+id+')">◷ Waiting</button><button class="complete" onclick="complete('+id+')">✓ Complete</button></div>'}
function closeDetail(){detail.className="overlay";detail.innerHTML=""}
function setStatus(id,s){tickets=tickets.map(t=>t.id===id?{...t,status:s,priority:s==="Open"?"blue":t.priority}:t);save();toast("Ticket accepted");render()}
function complete(id){tickets=tickets.map(t=>t.id===id?{...t,status:"Completed",priority:"green"}:t);save();closeDetail();render();toast("Ticket completed")}
function waiting(id){detail.innerHTML='<div class="detailTop"><button onclick="openTicket('+id+')">‹</button><b>Set Follow-up</b><button>⋮</button></div><div class="sheet form"><div class="detailCard"><div class="row"><span class="pill gold">Waiting</span><b>Keep things moving</b></div><label>Waiting For</label>'+["Supplier","Landlord","Contractor","Staff","Other"].map((x,i)=>'<label class="radio"><input type="radio" name="wait" '+(i===2?"checked":"")+'> Waiting for '+x+'</label>').join("")+'<label>Reminder Date</label><input type="date"><label>Reminder Time</label><input type="time" value="10:00"><label>Notes</label><textarea>Technician booked for Friday 10:00 AM.</textarea><button class="primary" onclick="saveWaiting('+id+')">Save Follow-up</button></div></div>'}
function saveWaiting(id){tickets=tickets.map(t=>t.id===id?{...t,status:"Waiting",priority:"gold"}:t);save();closeDetail();render();toast("Follow-up saved")}
function newTicket(){detail.className="overlay show";detail.innerHTML='<div class="detailTop"><button onclick="closeDetail()">‹</button><b>New Ticket</b><button></button></div><div class="sheet form"><div class="detailCard"><label>Store</label><select id="ns">'+stores.map(s=>'<option>'+s+'</option>').join("")+'</select><label>Title</label><input id="nt" placeholder="What needs attention?"><label>Description</label><textarea id="nd" placeholder="Describe the issue"></textarea><label>Priority</label><select id="np"><option>Normal</option><option>Urgent</option></select><label>Photo / Video</label><input type="file" accept="image/*,video/*" multiple><button class="primary" onclick="createTicket()">Submit to HQ</button></div></div>'}
function createTicket(){const title=document.getElementById("nt").value.trim();if(!title){toast("Add a title");return}const pri=document.getElementById("np").value;tickets.unshift({id:Date.now(),status:pri==="Urgent"?"Urgent":"Open",store:document.getElementById("ns").value,title,desc:document.getElementById("nd").value||"New store request.",age:"Just now",priority:pri==="Urgent"?"red":"blue"});save();closeDetail();page="tickets";render();toast("Ticket created")}
render();
</script></body></html>
