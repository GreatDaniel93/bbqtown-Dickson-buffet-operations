name: Build Hanok Ops APK

on:
  push:
    branches: [hanok-ops-apk-build]
    paths:
      - 'hanok-ops-apk/**'
      - '.github/workflows/hanok-ops-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: hanok-ops-apk
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp hanok-ops-apk/app/build/outputs/apk/debug/app-debug.apk Hanok-Ops-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hanok-Ops-APK
          path: Hanok-Ops-v0.1.apk
          if-no-files-found: error
