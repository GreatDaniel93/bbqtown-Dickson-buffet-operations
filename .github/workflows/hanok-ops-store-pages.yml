name: Deploy Hanok Ops Store Portal

on:
  push:
    branches:
      - hanok-ops-apk-build
    paths:
      - 'store-portal/**'
      - '.github/workflows/hanok-ops-store-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hanok-ops-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Store Portal
        uses: actions/upload-pages-artifact@v4
        with:
          path: store-portal

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
